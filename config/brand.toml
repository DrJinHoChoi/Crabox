[[faq]]
q = "데이터피디는 어떤 회사인가요?"
a = "데이터피디(DataPD)는 스마트이어 주식회사가 운영하는 데이터 기반 마케팅·콘텐츠 기획 브랜드입니다."

[[faq]]
q = "스마트이어 주식회사에 문의하려면 어떻게 하나요?"
a = "공식 홈페이지 문의 양식 또는 대표 이메일로 연락하실 수 있습니다."

[monitor]
# 브랜드 모니터링 검색어
queries = ["스마트이어 주식회사", "데이터피디", "스마트이어 데이터피디", "DataPD"]
# 부정 신호 키워드 — 탐지 시 '대응 검토' 대상으로 분류 (숨기기용이 아니라 빠른 대응용)
negative_keywords = [
  "사기", "피해", "환불", "먹튀", "불만", "최악", "고소", "소송", "체불", "임금",
  "갑질", "퇴사", "블랙", "후기 안좋", "주의", "논란", "연락두절", "허위", "과장",
]
positive_keywords = ["추천", "만족", "성과", "수상", "선정", "협약", "투자 유치", "성장"]
