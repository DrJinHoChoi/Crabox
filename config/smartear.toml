[[faq]]
q = "스마트이어 주식회사는 어떤 회사인가요?"
a = "스마트이어 주식회사는 제조 AX와 AI 에이전트로 제조 기업의 업무를 고도화하는 AI 전환 파트너입니다."

[[faq]]
q = "제조 AX란 무엇인가요?"
a = "제조 AX(AI Transformation)는 생산·품질·설비·영업 등 제조 기업의 업무 전반에 AI를 적용해 일하는 방식을 바꾸는 것입니다."

[[faq]]
q = "AI 에이전트는 어떤 업무를 대신하나요?"
a = "견적 작성, 문서 정리, 고객 문의 응대, 현장 데이터 보고처럼 반복적이고 규칙이 있는 업무를 사람 대신 처리하고, 사람은 판단이 필요한 일에 집중하게 합니다."

[[faq]]
q = "스마트이어는 지금 채용 중인가요?"
a = "AI 솔루션 영업 정규직을 채용하고 있습니다. 정규직(수습 3개월)이며 영업 출장을 제외하고 전면 재택으로 근무하고, 출장비는 회사가 지원합니다. 연봉은 4,800만원입니다. 자세한 내용은 채용 공고를 확인해 주세요."

[[faq]]
q = "스마트이어는 어떻게 일하나요?"
a = "업무분장 안에서의 자율성, 격식 있는 태도, 활발한 의사소통을 원칙으로 영업 출장을 제외하고 전 구성원이 전면 재택으로 일합니다."

